# The legacy INI format, which frp accepted up to v0.52.0 and still reads for
# compatibility. `frpc` picks the format by content, not by extension: a file
# whose text parses as INI and contains a `[common]` section is treated as this
# format, so this file and `frpc.toml` are interchangeable.
#
# Two things are worth knowing about it.
#
# * Values are taken literally. There is no quote stripping, so a quoted value
#   keeps its quotes — `token = "abc"` authenticates with `"abc"`. That is frp's
#   behaviour, not a bug here.
# * A trailing `#` on a value line is part of the value, not a comment.
#
# Section and key names are case-sensitive. Every `[name]` section other than
# `[common]` is a proxy.

[common]
# A literal IPv6 address needs square brackets here only when it carries a port,
# as in "[::1]:80". For `server_addr` on its own, `::` is fine.
server_addr = 0.0.0.0
server_port = 7000

# Everything below is optional; the values shown are the defaults.

# STUN server to help penetrate NAT hole.
# nat_hole_stun_server = stun.easyvoip.com:3478

# The maximum amount of time a dial to server will wait for a connect to
# complete.
# dial_server_timeout = 10

# The interval between keep-alive probes. Negative disables them.
# dial_server_keepalive = 7200

# Connect to frps through an http/socks5/ntlm proxy. Only used when
# protocol = tcp.
# http_proxy = http://user:passwd@192.168.1.128:8080
# http_proxy = socks5://user:passwd@192.168.1.128:1080

# "console" or a path. A path is rotated daily and trimmed to log_max_days.
log_file = ./frpc.log

# trace, debug, info, warn, error
log_level = info

log_max_days = 3

# Disables ANSI colouring when log_file is console.
disable_log_color = false

# Whether to sign heartbeats and new work connections with the token. Both
# default to false, matching frps's `auth.additionalScopes`.
authenticate_heartbeats = false
authenticate_new_work_conns = false

# Authentication. The default method is token.
authentication_method = token
token = 12345678

# OIDC, when authentication_method = oidc.
# oidc_client_id =
# oidc_client_secret =
# oidc_audience =
# oidc_scope =
# oidc_token_endpoint_url =

# Bound the number of proxies this client may register.
# user = your_name
# start = ssh,dns

# The management API.
# admin_addr = 127.0.0.1
# admin_port = 7400
# admin_user = admin
# admin_pwd = admin

# Per-proxy port ranges may be restricted.
# allow_ports = 2000-3000,3001,3003,4000-50000

# Extra files to read proxies from. This is expanded, not merely recorded.
# includes = ./confd/*.ini

# Connection pool size for the fixed tcpMux path.
# pool_count = 5

# tcp multiplexing, on by default. It is a server-side decision as much as a
# client-side one: frps wraps whatever it accepts in yamux when its own setting
# is on, so the two must match.
tcp_mux = true

# tcp, kcp, quic, websocket, wss
protocol = tcp

# v1 or v2. v2 needs a server that negotiates the hello exchange.
# wire_protocol = v1

# TLS over the control connection.
tls_enable = true
# tls_cert_file =
# tls_key_file =
# tls_trusted_ca_file =
# tls_server_name =

# The first login's failure is fatal by default.
login_fail_exit = true

# The buffer the server reads a UDP datagram into.
udp_packet_size = 1500

# Free-form key/value pairs handed to the server plugin system. The `meta_`
# prefix is stripped from the key.
# meta_region = eu
# meta_env = prod


# A plain TCP tunnel.
[ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000
# Encrypt and compress the work connection. Compression is snappy and it wraps
# the encryption, so the bytes on the wire are snappy(aes_cfb(plaintext)).
# use_encryption = false
# use_compression = false
# Restricts which visitors may reach this proxy; '*' allows anyone.
# allow_users = user1,user2

# A UDP tunnel.
[dns]
type = udp
local_ip = 127.0.0.1
local_port = 53
remote_port = 6001

# Port ranges: one proxy per pair, named `<section>_<index>`.
[range:tcp_port]
type = tcp
local_ip = 127.0.0.1
local_port = 6000-6001
remote_port = 6000-6001

[range:udp_port]
type = udp
local_ip = 127.0.0.1
local_port = 6000-6001
remote_port = 6000-6001

# An HTTP tunnel, routed by the server on domain or subdomain. The `http_`
# prefix on the auth and header keys is a legacy spelling; the modern TOML keys
# are `httpUser`/`httpPassword` and `requestHeaders`/`responseHeaders`.
[web01]
type = http
local_ip = 127.0.0.1
local_port = 80
custom_domains = www.example.com,other.example.com
# subdomain = web01
# locations = /,/api
# host_header_rewrite = 127.0.0.1
# http_user = admin
# http_pwd = admin
# route_by_http_user = user1,user2
# header_X-From-Where = frp
# response_header_X-From-Where = frp

[web02]
type = https
local_ip = 127.0.0.1
local_port = 443
subdomain = web02
# use_encryption = false
# use_compression = false

# A multiplexed tunnel, reached with an `HTTP CONNECT`. The domain names the
# tunnel, not a host on the far side — use something that is not a real name.
#   ssh -o 'proxycommand socat - PROXY:server:remote:22,proxyport=25002' root@remote
[tcpmuxhttpconnect]
type = tcpmux
multiplexer = httpconnect
local_ip = 127.0.0.1
local_port = 22
custom_domains = remote

# A secret tunnel: nothing is published on the server, and a visitor on another
# client binds the local port. The `sk` values must match on both sides.
[secret_tcp]
type = stcp
sk = abcdefg
local_ip = 127.0.0.1
local_port = 22
# allow_users = user1,user2

# The other end of it. `server_name` names the proxy above, not this section.
[secret_tcp_visitor]
role = visitor
type = stcp
server_name = secret_tcp
sk = abcdefg
bind_addr = 127.0.0.1
bind_port = 9000
# use_encryption = false
# use_compression = false

# A UDP secret tunnel: the same handshake over a socket instead of a listener.
[secret_udp]
type = sudp
sk = abcdefg
local_ip = 127.0.0.1
local_port = 53
# allow_users = user1,user2

[secret_udp_visitor]
role = visitor
type = sudp
server_name = secret_udp
sk = abcdefg
bind_addr = 127.0.0.1
bind_port = 9001
# use_encryption = false
# use_compression = false

# A client-side plugin. The `plugin_` prefix is kept, unlike `meta_` and
# `header_`, because it is part of the key. The proxy's own local_port is
# ignored when a plugin is present — the plugin owns the backend address.
[plugin_unix_domain_socket]
type = tcp
remote_port = 6005
plugin = unix_domain_socket
plugin_unix_path = /var/run/docker.sock

[plugin_http_proxy]
type = tcp
remote_port = 6006
plugin = http_proxy
plugin_http_user = abc
plugin_http_passwd = abc

[plugin_socks5]
type = tcp
remote_port = 6007
plugin = socks5
plugin_user = abc
plugin_passwd = abc

[plugin_static_file]
type = tcp
remote_port = 6008
plugin = static_file
plugin_local_path = /var/www/blog
plugin_strip_prefix = static
plugin_http_user = abc
plugin_http_passwd = abc

[plugin_https2http]
type = tcp
remote_port = 6009
plugin = https2http
plugin_local_addr = 127.0.0.1:80
plugin_crt_path = ./server.crt
plugin_key_path = ./server.key
plugin_host_header_rewrite = 127.0.0.1
plugin_header_X-From-Where = frp

[plugin_https2https]
type = tcp
remote_port = 6010
plugin = https2https
plugin_local_addr = 127.0.0.1:443
plugin_crt_path = ./server.crt
plugin_key_path = ./server.key
plugin_host_header_rewrite = 127.0.0.1
plugin_header_X-From-Where = frp
